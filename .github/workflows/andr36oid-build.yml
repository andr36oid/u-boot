name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu make bison flex bc swig \
            python3 python-is-python3 python3-dev libssl-dev device-tree-compiler

      - name: Build
        run: |
          # make.sh wants the Linaro 6.3.1 toolchain next to the tree: point it at the host one
          tc=../prebuilts/gcc/linux-x86/aarch64/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu/bin
          mkdir -p "$tc"
          for t in /usr/bin/aarch64-linux-gnu-*; do ln -sf "$t" "$tc/"; done
          # Newer compilers warn where GCC 6 did not
          KCFLAGS="-Wno-error -fcommon" ./make.sh odroidgoa

      - name: Name the release
        id: name
        run: |
          echo "tag=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/dist"
          cp sd_fuse/uboot.img sd_fuse/trust.img "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          sha256sum uboot.img trust.img > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          SHORT: ${{ steps.name.outputs.short }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Built from commit $GITHUB_SHA.

          The U-Boot andr36oid images ship with (Hardkernel ODROID-GO Advance U-Boot 2017.09 with the
          R36S and clone support). A wrong bootloader can leave a console unable to start from this
          card until the card is rewritten on a computer, so keep a copy of what you replace.

          On the SD card (512-byte sectors):
          - \`uboot.img\` at sector 16384
          - \`trust.img\` at sector 24576

          The first-stage loader (\`idbloader.img\`, sector 64) is not built here and stays as it is.
          \`SHA256SUMS\` lists the checksums of both files.
          NOTES
          cd "$RUNNER_TEMP/dist"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "U-Boot 2017.09 andr36oid, $TAG ($SHORT)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            uboot.img trust.img SHA256SUMS
